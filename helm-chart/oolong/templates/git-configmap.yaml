{{- if and .Values.gitPod.enabled .Values.persistence.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oolong.fullname" . }}-git-script
  labels:
    {{- include "oolong.labels" . | nindent 4 }}
    app.kubernetes.io/component: git
data:
  git-sync.sh: |
    #!/bin/sh
    set -e

    echo "Starting Git sync script..."

    if ! command -v flock >/dev/null 2>&1; then
      echo "ERROR: flock is required for single-writer publication"
      exit 1
    fi

    if [ -z "$GIT_REPO_URL" ]; then
      echo "ERROR: GIT_REPO_URL environment variable is not set"
      exit 1
    fi

    CONTENT_DIR="${CONTENT_DIR:-/content}"
    WORK_DIR="${CONTENT_DIR}/_work"
    REVISIONS_DIR="${CONTENT_DIR}/revisions"
    POINTER_FILE="${CONTENT_DIR}/.oolong-current-revision"
    SYNC_INTERVAL="${SYNC_INTERVAL:-60}"
    GIT_BRANCH="${GIT_BRANCH:-main}"
    REVISION_RETENTION_COUNT="${REVISION_RETENTION_COUNT:-5}"

    case "$REVISION_RETENTION_COUNT" in
      ''|*[!0-9]*)
        echo "ERROR: REVISION_RETENTION_COUNT must be a positive integer" >&2
        exit 1
        ;;
    esac

    if [ "$REVISION_RETENTION_COUNT" -lt 1 ] ||
       [ "$REVISION_RETENTION_COUNT" -gt 1000 ]; then
      echo "ERROR: REVISION_RETENTION_COUNT must be between 1 and 1000" >&2
      exit 1
    fi

    . /scripts/git-publish.inc.sh

    validate_git_repo_url || exit 1
    configure_git_auth /scripts/git-credential-oolong.sh /etc/oolong-git-auth /tmp/oolong-git-ssh || exit 1

    echo "Configuration:"
    echo "  Repository: $GIT_REPO_URL"
    echo "  Auth: $OOLONG_GIT_AUTH_TYPE"
    echo "  Content Directory: $CONTENT_DIR"
    echo "  Work Directory: $WORK_DIR"
    echo "  Branch: $GIT_BRANCH"
    echo "  Sync Interval: ${SYNC_INTERVAL}s"
    echo "  Revision retention: ${REVISION_RETENTION_COUNT}"

    git config --global --add safe.directory "$WORK_DIR"
    git config --global protocol.file.allow never
    git config --global protocol.git.allow never
    if [ "$OOLONG_GIT_AUTH_TYPE" = ssh ]; then
      git config --global protocol.ssh.allow always
    else
      git config --global protocol.ssh.allow never
    fi
    git config --global protocol.ext.allow never
    git config --global protocol.http.allow never

    mkdir -p "$REVISIONS_DIR"

    locked_sync_and_publish

    echo "Starting sync loop..."
    while true; do
      echo "$(date '+%Y-%m-%d %H:%M:%S') - Fetching $GIT_BRANCH..."
      if locked_sync_and_publish; then
        echo "$(date '+%Y-%m-%d %H:%M:%S') - Sync successful"
      else
        echo "$(date '+%Y-%m-%d %H:%M:%S') - Sync failed, will retry"
      fi
      sleep "$SYNC_INTERVAL"
    done
  git-publish.inc.sh: |
{{ .Files.Get "scripts/git-publish.inc.sh" | nindent 4 }}
  git-credential-oolong.sh: |
{{ .Files.Get "scripts/git-credential-oolong.sh" | nindent 4 }}
{{- if eq (include "oolong.gitAuthType" .) "ssh" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oolong.fullname" . }}-git-ssh
  labels:
    {{- include "oolong.labels" . | nindent 4 }}
    app.kubernetes.io/component: git
data:
  passwd: |
    root:x:0:0:root:/root:/sbin/nologin
    oolong-git:x:{{ include "oolong.gitSshUid" . }}:{{ include "oolong.gitSshGid" . }}:oolong git sync:/tmp/git-home:/sbin/nologin
  {{- if .Values.gitPod.auth.ssh.knownHosts }}
  known_hosts: {{ .Values.gitPod.auth.ssh.knownHosts | toJson }}
  {{- end }}
{{- end }}
{{- end }}
