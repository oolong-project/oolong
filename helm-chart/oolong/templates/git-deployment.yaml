{{- if and .Values.gitPod.enabled .Values.persistence.enabled }}
{{- include "oolong.requireGitRepoUrl" . }}
{{- include "oolong.requireGitPodEnvNotReserved" . }}
{{- $gitAuthType := include "oolong.gitAuthType" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oolong.fullname" . }}-git
  labels:
    {{- include "oolong.labels" . | nindent 4 }}
    app.kubernetes.io/component: git
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "oolong.gitSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/git-script: {{ include (print $.Template.BasePath "/git-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "oolong.gitSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: git
          securityContext:
            {{- toYaml .Values.gitPod.securityContext | nindent 12 }}
          image: "{{ .Values.gitPod.image }}"
          imagePullPolicy: {{ .Values.gitPod.imagePullPolicy }}
          command: ["/bin/sh"]
          args: ["/scripts/git-sync.sh"]
          {{- if .Values.gitPod.resources }}
          resources:
            {{- toYaml .Values.gitPod.resources | nindent 12 }}
          {{- end }}
          env:
            {{- range $key, $value := .Values.gitPod.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: OOLONG_GIT_AUTH_TYPE
              value: {{ $gitAuthType | quote }}
            - name: HOME
              value: "/tmp/git-home"
            - name: GIT_REPO_URL
              value: {{ .Values.gitPod.repoUrl | quote }}
            - name: GIT_BRANCH
              value: {{ .Values.gitPod.branch | default "main" | quote }}
            - name: GIT_REPO_HOST_ALLOWLIST
              value: {{ .Values.gitPod.allowedHosts | default list | join "," | quote }}
            - name: CONTENT_DIR
              value: {{ .Values.gitPod.mountPath | quote }}
            - name: SYNC_INTERVAL
              value: {{ .Values.gitPod.syncInterval | default "60" | quote }}
            - name: REVISION_RETENTION_COUNT
              value: {{ .Values.gitPod.revisionRetentionCount | quote }}
          volumeMounts:
            - name: oolong-content
              mountPath: {{ .Values.gitPod.mountPath }}
            - name: git-script
              mountPath: /scripts
              readOnly: true
            - name: git-home
              mountPath: /tmp/git-home
            {{- if or (eq $gitAuthType "token") (eq $gitAuthType "ssh") }}
            - name: git-auth
              mountPath: /etc/oolong-git-auth
              readOnly: true
            {{- end }}
            {{- if eq $gitAuthType "ssh" }}
            - name: git-ssh
              mountPath: /tmp/oolong-git-ssh
            - name: git-passwd
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            {{- end }}
      volumes:
        - name: oolong-content
          persistentVolumeClaim:
            claimName: {{ include "oolong.fullname" . }}-content
        - name: git-script
          configMap:
            name: {{ include "oolong.fullname" . }}-git-script
            defaultMode: 0700
        - name: git-home
          emptyDir: {}
        {{- if eq $gitAuthType "token" }}
        - name: git-auth
          secret:
            secretName: {{ .Values.gitPod.auth.existingSecret | quote }}
            defaultMode: 0440
            optional: false
            items:
              - key: {{ .Values.gitPod.auth.token.usernameKey | quote }}
                path: username
              - key: {{ .Values.gitPod.auth.token.tokenKey | quote }}
                path: token
        {{- else if eq $gitAuthType "ssh" }}
        {{- $ssh := .Values.gitPod.auth.ssh }}
        - name: git-auth
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.gitPod.auth.existingSecret | quote }}
                  optional: false
                  items:
                    - key: {{ $ssh.privateKeyKey | quote }}
                      path: identity
                    {{- if $ssh.knownHostsKey }}
                    - key: {{ $ssh.knownHostsKey | quote }}
                      path: known_hosts
                    {{- end }}
              {{- if $ssh.knownHosts }}
              - configMap:
                  name: {{ include "oolong.fullname" . }}-git-ssh
                  items:
                    - key: known_hosts
                      path: known_hosts
              {{- end }}
        - name: git-ssh
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: git-passwd
          configMap:
            name: {{ include "oolong.fullname" . }}-git-ssh
            defaultMode: 0444
            items:
              - key: passwd
                path: passwd
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
