# Default values for oolong chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image: registry.rearmhq.com/library/oolong-server:26.11.0@sha256:07bc20ad98ff6700fcc1a72695cb183bfb71300a910786b7a5244558a90eeb4d

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""


podAnnotations: {}

podSecurityContext:
  fsGroup: 10001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 3000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Persistent Volume Claim
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 2Gi
  storageClass: ""

# Git pod configuration
gitPod:
  enabled: false
  image: alpine/git:2.54.0@sha256:6a1fdb962814ca11508ca8d1bab94375b5b7ac4e4a9a40981c29fc32c02f095d
  imagePullPolicy: IfNotPresent
  # Mount path for the shared volume
  mountPath: /content
  # Resources for the git pod
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 50m
    #   memory: 64Mi
  # Git repository configuration
  # https:// Git URL without credentials, or for auth.type ssh an
  # ssh://[user@]host[:port]/path or [user@]host:path URL (required when gitPod.enabled is true).
  # Never put a password or token in the URL.
  repoUrl: ""
  # Optional exact-match hostname allowlist. Empty allows any host.
  # For ssh URLs the host is the part after user@ and before :port or :path.
  # Hostname checks do not follow DNS changes or Git redirects; restrict
  # Git-pod egress with a NetworkPolicy or cluster egress control.
  allowedHosts: []
  branch: "main"  # Git branch to sync
  syncInterval: "60"  # Sync interval in seconds
  # Server polls for new revisions when git sync is enabled (milliseconds).
  contentReloadIntervalMs: 60000
  # Immutable revision directories kept on the content PVC (oldest pruned after publish).
  # Integer 1-1000, passed as REVISION_RETENTION_COUNT. Not interpolated into shell.
  revisionRetentionCount: 5
  # Security context for git pod
  securityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 10001
  # Additional environment variables for git pod
  env: {}
  # Credentials for a private repository. type is one of:
  #   none  - anonymous clone (default)
  #   token - HTTPS username + token read from an existing Secret
  #   ssh   - SSH deploy key read from an existing Secret; host keys always verified
  auth:
    type: none
    # Name of an existing Secret in the release namespace. Required when type
    # is token or ssh; must be empty when type is none. The chart never creates it.
    existingSecret: ""
    token:
      # Keys in existingSecret holding the HTTPS username and the token.
      usernameKey: username
      tokenKey: token
    ssh:
      # Key in existingSecret holding the unencrypted private key (OpenSSH or PEM).
      # ssh-privatekey matches the kubernetes.io/ssh-auth Secret type.
      privateKeyKey: ssh-privatekey
      # known_hosts for the Git host is required: set exactly one of these two.
      # knownHostsKey: key in existingSecret holding known_hosts lines.
      knownHostsKey: ""
      # knownHosts: known_hosts lines inline (public data; use --set-file or a values file).
      knownHosts: ""

# Pagination token HMAC key (required unless PAGE_TOKEN_DEV_FALLBACK=true and
# NODE_ENV is not production). The chart never sets that opt-in.
# Default: chart creates <release-fullname>-page-token (re-rendered on upgrade with the
# existing encoded value; not rotated automatically). Set existingSecret to BYO instead.
pageTokenSecret:
  create: true
  existingSecret: ""
  secretKey: PAGE_TOKEN_SECRET
  # Optional fixed value on first install when create=true and existingSecret is empty.
  # Leave empty to generate a random value once.
  value: ""

# Environment variables
env:
  API_VERSION: "v1.0.0"
  SERVER_HOST: "http://localhost:3000"
  DEBUG_MODE: "false"  # Set to "true" to enable verbose debug logging
  # CONTENT_RELOAD_INTERVAL_MS is set automatically when gitPod.enabled and persistence are on.

# Health check configuration
healthcheck:
  enabled: true
  path: "/.well-known/tea"
  livenessPath: "/healthz"
  readinessPath: "/.well-known/tea"
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 3

# Traefik ingress configuration
useTraefikLe: false
traefikBehindLb: false
ingressHost: oolong.localhost
servicePort: 3000
useTraefikDevelopment: false
