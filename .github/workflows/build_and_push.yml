on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'

name: Build Oolong Container Image And Submit Metadata To ReARM Demo

jobs:
  build-oolong:
    permissions:
      id-token: write
    name: Build And Push Oolong Server Container Image
    runs-on: ubuntu-latest
    steps:
      - name: ReARM Build And Submit Oolong Release
        uses: relizaio/rearm-docker-action@93cb347cb43ea772ff980e23694b8ec8f1d011aa # v1.15.1
        with:
          registry_username: ${{ secrets.DOCKER_LOGIN }}
          registry_password: ${{ secrets.DOCKER_TOKEN }}
          registry_host: registry.rearmhq.com
          image_namespace: registry.rearmhq.com/library
          image_name: oolong-server
          rearm_api_id: ${{ secrets.REARM_OOLONG_API_ID }}
          rearm_api_key: ${{ secrets.REARM_OOLONG_API_KEY }}
          rearm_api_url: https://demo.rearmhq.com
          path: oolong
          enable_sbom: true
          source_code_sbom_type: 'npm'
          enable_public_cosign_sigstore: 'true'
          enable_codeql: 'true'
          codeql_language: 'javascript'
  build-oolong-helm:
    permissions:
      id-token: write
      contents: write
    name: Build And Push Oolong Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: ReARM Build And Submit Oolong Helm Chart metadata action
        uses: relizaio/rearm-helm-action@eb6aa8be30c8de5b5549e8e96f9210a85103c7d5 # v1.12.1
        with:
          registry_username: ${{ secrets.DOCKER_LOGIN }}
          registry_password: ${{ secrets.DOCKER_TOKEN }}
          registry_host: registry.rearmhq.com/library
          helm_chart_name: oolong
          rearm_api_id: ${{ secrets.REARM_OOLONG_HELM_API_ID }}
          rearm_api_key: ${{ secrets.REARM_OOLONG_HELM_API_KEY }}
          rearm_api_url: https://demo.rearmhq.com
          path: helm-chart/oolong
          enable_sbom: true
          enable_public_cosign_sigstore: true
          limit_to_branches: main
